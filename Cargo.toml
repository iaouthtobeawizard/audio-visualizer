[package]
name = "audio-visualizer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
cpal = "0.18"
rustfft = "6.4.1"
serde = { version = "1.0.229" , features = ["derive"]}
serde_json = "1.0.15"
thiserror = "2.0.20"
pipewire = "0.10.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lib]
name = "audio_visualizer"
path = "src/lib.rs"
